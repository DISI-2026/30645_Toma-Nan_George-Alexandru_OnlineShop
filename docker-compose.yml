services:
    backend:
        build:
            context: ./backend
        ports:
            - "8000:8000"
        environment:
            APP_HOST: 0.0.0.0
            APP_PORT: 8000
            DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/onlineshop
            AUTO_INIT_DB: "true"
            # RESET_DB_ON_STARTUP: "true"
            FRONTEND_BASE_URL: http://localhost:3000
            PASSWORD_RESET_TOKEN_TTL_MINUTES: 30
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            SMTP_FROM_EMAIL: no-reply@onlineshop.ro
            # For persistent data later, disable automatic resets:
            RESET_DB_ON_STARTUP: "false"
            #Neo4j
            NEO4J_URI: bolt://neo4j:7687
            NEO4J_USER: neo4j
            NEO4J_PASSWORD: neo4jpwd
            NEO4J_DATABASE: neo4j
        depends_on:
            db:
                condition: service_healthy
        # Uncomment to persist uploaded files on the host:
        volumes:
            - ./backend/media:/app/media
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    db:
        image: postgres:16-alpine
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: onlineshop
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        # tmpfs:
        #     - /var/lib/postgresql/data
        # Uncomment this and remove tmpfs above to persist Postgres data:
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d onlineshop"]
            interval: 10s
            timeout: 5s
            retries: 5

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025" # web UI
            - "1025:1025" # SMTP

    neo4j:
        image: neo4j:5.26-community
        container_name: neo4j
        ports:
            - "7474:7474" # Neo4j Browser: http://localhost:7474
            - "7687:7687" # Bolt protocol used by the Python driver
        environment:
            NEO4J_AUTH: neo4j/neo4jpwd
            NEO4J_server_memory_heap_initial__size: 512m
            NEO4J_server_memory_heap_max__size: 1G
            NEO4J_server_memory_pagecache_size: 512m
        volumes:
            - neo4j_data:/data
            - neo4j_logs:/logs
            - neo4j_import:/var/lib/neo4j/import
            - neo4j_plugins:/plugins
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q --spider http://localhost:7474 || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 10

# Uncomment when enabling persistent Postgres storage:
volumes:
    postgres_data:
    neo4j_data:
    neo4j_logs:
    neo4j_import:
    neo4j_plugins:
