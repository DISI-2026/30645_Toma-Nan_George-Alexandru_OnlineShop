services:
    backend:
        build:
            context: ./backend
        ports:
            - "8000:8000"
        environment:
            APP_HOST: 0.0.0.0
            APP_PORT: 8000
            DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/onlineshop
            AUTO_INIT_DB: "true"
            RESET_DB_ON_STARTUP: "true"
            FRONTEND_BASE_URL: http://frontend:3000
            PASSWORD_RESET_TOKEN_TTL_MINUTES: 30
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            SMTP_FROM_EMAIL: no-reply@onlineshop.ro
            # For persistent data later, disable automatic resets:
            # RESET_DB_ON_STARTUP: "false"
        depends_on:
            db:
                condition: service_healthy
        # Uncomment to persist uploaded files on the host:
        # volumes:
        #     - ./backend/media:/app/media
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    db:
        image: postgres:16-alpine
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: onlineshop
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        tmpfs:
            - /var/lib/postgresql/data
        # Uncomment this and remove tmpfs above to persist Postgres data:
        # volumes:
        #     - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d onlineshop"]
            interval: 10s
            timeout: 5s
            retries: 5

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025" # web UI
            - "1025:1025" # SMTP

# Uncomment when enabling persistent Postgres storage:
# volumes:
#     postgres_data:
